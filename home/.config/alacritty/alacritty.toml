
[cursor.style]
shape = "Block"

[font]
size = 13.0

[font.normal]
family = "PlemolJP Console NF"

[window]
dynamic_padding = true
opacity = 0.9

[window.padding]
x = 5
y = 5

[general]
live_config_reload = true

[terminal.shell]
# Alacritty started from niri does not inherit the mise shims PATH (only
# .zshenv adds it), so add it here before exec'ing pwsh.
program = "bash"
args = ["-c", "PATH=\"$HOME/.local/share/mise/shims:$PATH\" exec pwsh"]

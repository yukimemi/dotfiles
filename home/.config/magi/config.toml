# magi, machine-wide.
#
# This is the lowest-precedence config layer that magi reads. Everything here
# applies to every repository on this machine, and any repository's own
# `magi.toml` overrides it — which is the point: state a preference once here,
# and let each project state only what is peculiar to it.
#
# Layers, in increasing precedence:
#   1. built-in defaults (roster derived from the agent CLIs on PATH)
#   2. this file
#   3. <repo>/.magi/config.toml
#   4. <repo>/magi.toml
#   5. --config <path>

# The roster is the agent CLIs installed on this machine, so it belongs here
# rather than in any one repository.
#
# Gemini CLI is absent on purpose: Google retired the standalone client for
# individual accounts, so the roster is claude (two models), opencode,
# Antigravity and Codex.

[[agents]]
id = "opus"
kind = "claude"
model = "opus"

[[agents]]
id = "sonnet"
kind = "claude"
model = "sonnet"

[[agents]]
id = "oc"
kind = "opencode"

[[agents]]
id = "agy"
kind = "antigravity"

[[agents]]
id = "cx"
kind = "codex"
model = "gpt-5.6-terra"

# Seat assignment is a cost decision, and the numbers are measured, not guessed.
# One implement seat cost $12.09 on opus against $6.95 on sonnet for the same
# task - 1.7x - while `oc` reported $0.00. The driver is internal tool-loop
# iterations (111 and 134 turns respectively): every turn re-reads the cached
# context, so cache_read ends up ~= turns * context size, and the implement node
# is where the turns are.
#
# Hence: the expensive model never implements. opus judges instead, which is a
# handful of turns, and the free CLIs carry the implementation load.
[roles]
# Order matters now that one seat is the default: `resolve_roles` takes the
# first `candidates` entries, so entry one writes every solo patch. On the
# workload measured so far sonnet won 5 of 8 entries (62%), oc 3 of 7 (43%).
#
# `agy` stays in the roster. Its 0 of 4 is a reporting defect and not a verdict
# on its patches - it does the work in child processes and its CLI hangs up on
# its own stream before delivering, which is what `dropped_stream` now detects
# and resumes. But a solo task has no second candidate to fall back on, so the
# seat that reports reliably goes first.
# implementers = ["sonnet", "cx", "oc", "agy"]
implementers = ["sonnet", "oc", "agy"]
# Rotated so no judge sits on its own candidate. Only matters when a task asks
# for more than one candidate.
# judges = ["opus", "agy", "cx"]
judges = ["opus", "agy"]
# `cx` is the only seat whose read-only-ness the CLI enforces (`--sandbox
# read-only`), which is exactly what a reviewer is: it cannot touch the tree it
# is reviewing even if it decides to.
# reviewers = ["cx", "sonnet"]
reviewers = ["agy", "sonnet"]
# Not the winner's own author by default: the fixer would inherit the
# implementer's 100-turn session, and with it the whole accumulated cache-read
# bill.
#
# That no longer holds for a solo task, where sonnet implements and sonnet
# fixes. Left as it is on purpose: the reason above is cost, not correctness,
# and the seat that just wrote the patch is the one that knows why.
fixer = "sonnet"
# Who runs the `magi plan` CLI interview. Also the fallback for `chatter`
# below when that is unset, so Planning and Talk land here too if nobody
# picked a chatter.
#
# Default for the Planning interview (web UI) and the resident Talk
# conversation, separate from planner on purpose: these open far more often
# than `magi plan`, and opus is also a judge seat above - the two together
# caused a chat turn to time out (`agent opus did not answer within 300s`)
# while a competition's judge wave was running concurrently.
chatter = "sonnet"
# Arranges the queue between polls (`crate::conduct`). Pinned to opus so it
# doesn't fall back to sharing a seat with the judge/reviewer roster above.
conductor = "opus"

# The shape of a run is a preference about time and money, not about any one
# repository. A repo that genuinely needs a different shape says so in its own
# magi.toml.
[graph]
# One implementation by default. Competition is still here and still wins work
# worth having - it is simply no longer what every task buys without being
# asked. See `Graph::candidates` for the numbers behind this.
candidates = 1
judges = 3
deliberate_rounds = 1
reviewers = 2
# Three, against the built-in six: a fourth round has never turned a blocked
# run into a clean one here, and every round is two reviewers plus a fixer.
review_rounds = 3
max_parallel = 3
# What the agents write in. The operator reads Japanese; the code and its
# comments stay English, which the prompts say separately.
language = "ja"
sessions = true
# `land` は既定で true (Graph::default) なのでここでは書かない。`land_approval`
# だけ既定の true から false に落とす: review 2回 approve + gate green まで
# 通った ready run が、squash マージの一言を人間が打つのを待つだけで日次で
# 溜まっていくのが実際に繰り返し起きた（2026-09-11、ready 状態の run が
# 9件溜まり、うち1件は「[merge] mode を "none" から "pr" にする」という、
# この放置自体を直すはずの変更だった）。二重ガード (`land` と
# `land_approval` を両方 non-default にして初めて無人マージになる、
# `graph.rs` のコメント参照) のうち、人間の承認だけを外す。
#
# 安全側の担保は land_approval を切ってもそのまま残る: `land_rounds` の
# 上限、gate/e2e 両方 green が必須、`incomplete_review = "block"`
# （レビュアーの誰かが無回答ならマージしない）。切っているのは
# 「diffstat とレビュー内容を人間が目で見てから `merge` と打つ」一手間
# だけで、機械的なゲートは無人でも変わらない。
land_approval = false

[update]
mode = "notify"
# 常駐する magi web はこの間隔で新しいリリースを確認する。既定の1日では、
# v0.10.0 の公開直後にも更新に気づかず、手動で再起動することになった。
# 60秒の下限は GitHub の未認証レート制限（毎時60回）に合わせたものなので、
# 下限ぎりぎりにはせず10分にする。毎時6回なら他の用途の余地も残せる。
interval = "10m"

# Every checkout on this machine is jj-colocated, and jj keeps git's HEAD
# detached at the working-copy commit - so magi can never infer the base branch
# from `git symbolic-ref HEAD` here. It is the same answer for all of them, so
# it is stated once. A repository whose default branch is not `main` overrides
# it in its own magi.toml.
[merge]
base = "main"
# `mode` は既定の `"none"` から離れ、`"pr"` にする。`"none"` はブランチを残して
# 手でマージするコマンドを表示するだけで、その「手で」を誰もやらないと直った
# はずのものが直っていないまま止まる。run `20260907-075524-520f`
# （クォータ切れの run がタスクの attempt を食い潰す問題の修正）がまさにそれで、
# レビューもゲートも通って `ready` になったのに放置され、人手で PR #98 に
# されるまでマージされなかった。
#
# `"local"` にしないのは、このマシンの checkout が全て jj-colocated だから
# （上の `base` のコメントと同じ事情）。`"local"` は主ワークツリーで
# `git merge --no-ff` する経路で、jj が detach させている working-copy の HEAD に
# 触らせたくない。`"pr"` ならブランチを push して `gh pr create` するだけで
# working copy に触らず、CI も回り、最後のマージ承認は magi web の Questions
# 画面に出るのでスマホから完結できる。
#
# 代償もある: `land()` は承認が来るまで `attempt()` の中でブロックし、その間
# キューは1件も進まない。夜中に1件が承認待ちになれば backlog 全体が朝まで
# 止まる。これはキュー済みタスク `20260907-...-4063`
# 「働いていない run にキューのスロットを占有させない」で直る予定の既知の
# 欠陥で、それまでは承認をためないという運用で凌ぐ。
mode = "pr"

# Every checkout on this machine lives at `<home>/src/<host>/<owner>/<repo>`
# (ghq layout), so one root covers all of them. `home()` is teravars' own
# helper (`dirs::home_dir` - `$HOME` on Unix, `%USERPROFILE%` on Windows), so
# this line resolves the same way on any machine; `~` is a shell feature that
# magi does not expand, so it cannot be used here.
#
# The quotes must be single (TOML's literal string), not double. `home()`
# returns a raw Windows path with backslashes, and teravars renders it before
# TOML parses the result - a double-quoted (basic) string would then see
# `C:\Users\...` and choke on `\U` as an invalid escape, which broke magi
# startup entirely until this was caught. A literal string does not interpret
# escapes, so the backslashes pass through untouched and `magi repos` reads
# the path fine on Windows.
[repos]
roots = ['{{ home() }}/src']

[talk]
allow_write = true

# The one thing every repository in this fleet has to tell a magi node, for the
# same reason. Repository-specific conventions stay in each repo's own
# [prompts], which override nothing here - they are separate keys.
[prompts]
all = """
This repository uses jj (Jujutsu) with a colocated git repo. `git commit` works in a candidate worktree and is what magi expects, but never run `jj` commands and never touch the main working copy.
"""


[shell]
lang = "ja"
setup_wizard_enabled = false
polkit_agent = true
clipboard_enabled = true
clipboard_history_max_entries = 100

[shell.animation]
enabled = true
speed = 1.1

[shell.screenshot]
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot from %Y-%m-%d %H-%M-%S"
save_to_file = true
copy_to_clipboard = true
annotate = false

[brightness]
minimum_brightness = 0.05

[brightness.monitor.eDP-1]
backend = "backlight"
backlight_device = "intel_backlight"

[notification]
enable_daemon = true
filter_order = ["screenshots"]

[notification.filter.screenshots]
enabled = true
match = "Noctalia"
match_content = "^Screenshot saved$"
override_duration = 5000

[widget.media]
hide_when_no_media = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"
sync_color_scheme = true

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["niri", "alacritty", "gtk3", "gtk4"]

[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers/noctalia-demo"
transition = ["disc", "wipe", "zoom"]
transition_duration = 1000

[wallpaper.automation]
enabled = true
interval_seconds = 1800
order = "random"
recursive = false

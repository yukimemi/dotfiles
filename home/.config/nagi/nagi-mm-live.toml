lead_window_secs = 3              # ゲートI: リード変動の計測窓(秒)。レイテンシ差の話なので秒スケール。上限60s
lead_gate_bps = 0                 # ゲートI: 0=無効(既定)。★意図的に 0 のままデータ収集する。

# nagi — grid/DCA/trend backtest & paper/testnet 取引ボットの設定（作業コピー；自由に編集可）。
# 既定はペーパー（実価格・ローカル擬似約定、キー不要）。下の [execution] で Binance Spot
# testnet の実約定に opt-in できる（フェイク資金、キーは env 参照のみ）。実マネーは扱わない。
#
# === autotune が書き換える範囲 =====================================
# persist_config = true のとき、apply / auto-tune が書き戻すのは:
#   1) [[sleeve]] ブロック全部（戦略パラメータ・alloc・regime・label）
#   2) regime.trend_threshold_pct
# それ以外（このファイルの他のキーとコメント）は一切触りません。
#   → 機能トグル・コスト・方針ノブ = あなたが決める固定値
#   → 戦略の細かい数値・配分・トレンド閾値 = autotune が探索して上書き
# ===================================================================

# exchange / symbol / market / 手数料 / 鍵 は下の [vars] profile 1 箇所で切り替わる（teravars）
exchange = "{{ vars.profile }}"
{% if vars.profile == "bitbank" %}
symbol = "xrp_jpy" # bitbank: 現物アルト（リベート対象）
# symbol = "btc_jpy" # bitbank: 現物アルト（リベート対象）
initial_cash = 10000
{% else %}
symbol = "BTCUSDT" # binance: 1 インスタンス = 1 銘柄
initial_cash = 1000
{% endif %}
db_path = "nagi.db"

# --- インジケータの足（ボット唯一のタイムフレーム） -------------------
# regime / voltarget / 全 strategy（EMA・ATR・RSI）が共有する単一の足。
# autotune は触らない固定ノブ（optimize メタノブと同じ "あなたが決める" 層）。
# 短くすると noise/whipsaw、長くすると応答ラグで悪化 → 1h が実測スイートスポット。
# 変えるなら walkforward/autosim で複数窓を測って固定。per-sleeve には書かない
# （旧 config に残っていても無視され、この値が全コンポーネントへ伝播する）。
bar_secs = 3600 # 3600 = 1h

# --- 取引コスト（OOS を正直な数字にするため現実寄りに） -----------------
fee_rate = 0.001 # 既定の片道手数料（0.001 = 0.1%）。maker/taker のフォールバック
{% if vars.profile == "bitbank" %}
maker_fee = -0.0002     # bitbank 現物アルト(BTC以外)の maker リベート(-0.02%)。負値=入金。2026/2 以降も継続
taker_fee = 0.0012      # bitbank 現物アルト(BTC以外)の taker(0.12%)。※BTC/JPY だけ maker 0%/taker 0.10%
maker_adverse_bps = 2.0 # 逆選択(bp)。リベートを正直に評価するため必須（0だと幻想に過剰配分）
{% else %}
maker_fee = 0.001       # binance: 通常 0.1%（fee_rate と同値）
taker_fee = 0.001
maker_adverse_bps = 0.0
{% endif %}
slippage_bps = 1.0 # taker の不利スリッページ(bp, 1bp=0.01%)。1.0 ≈ 小口の現実値
# slippage_impact_bps_per_1k = 0.0  # taker の数量依存インパクト(bp/$1,000)。0=数量非依存
# maker_fill_penetration_bps = 0.0  # 指値の約定確率: この深さ(bp)貫通で100%約定、浅いと比例で部分約定し残りは継続。touch=不約定。0=貫通すれば全約定（従来通り）

# --- 市場タイプ -------------------------------------------------------
{% if vars.profile == "bitbank" %}
market = "spot" # JP 現物（funding なし・ロング志向）
{% else %}
market = "perp" # binance testnet（funding 計上・ショート可）
{% endif %}
funding_rate_8h = 0.0001 # perp 時のみ: 0.0001 = 0.01%/8h ≈ 11%/年（Binance 標準）。正=ロングが払う
# maint_margin_rate = 0.004 # perp 時のみ: 維持証拠金率。equity が |notional|*率 を割ると強制清算（Binance BTCUSDT ≈0.4%）。0=清算なし（従来通り）。spot は無関係だが残高超過の買い/保有超過の売りは常に拒否

# --- 起動・永続化 -----------------------------------------------------
autostart_trading = false # false=STANDBY 起動（監視+最適化のみ、注文は "▶ 取引開始" まで出さない）
# 下の [vars] profile スイッチ（teravars テンプレート）と併用可。persist は template-aware:
#   テンプレートを含む生ファイルは toml_edit で解析できないため、[[sleeve]] 領域と
#   trend_threshold_pct だけをテキスト書き換えし、Tera の制御ブロック/変数展開行は保全する。
persist_config = true     # apply/auto-tune が [[sleeve]] と trend_threshold_pct を書き戻す

# ===== 取引所プロファイル（teravars）: ここ 1 箇所で全部切り替わる ==========
# profile を変えるだけで exchange / symbol / market / 手数料 / venue / 鍵 が
# まとめて切り替わる。鍵は env 参照（リテラルは書かない）。
# ※ "bitbank" はフィード(#102)+REST(#103)実装済みだが、kline/執行配線（#101 Phase
#   1b/3b）が入るまで end-to-end 実行は不可（それまでは "binance" のまま運用）。
[vars]
profile = "bitbank" # ★ "binance"（Binance Spot testnet）| "bitbank"（JP 現物リベート）
binance_key = "{{ env(name='BINANCE_TESTNET_KEY', default='') }}"
binance_secret = "{{ env(name='BINANCE_TESTNET_SECRET', default='') }}"
bitbank_key = "{{ env(name='BITBANK_API_KEY', default='') }}"
bitbank_secret = "{{ env(name='BITBANK_API_SECRET', default='') }}"

[server]
host = "0.0.0.0"
port = 8787

# === ライブ/testnet 執行（M2 完了：`nagi run` が testnet で実約定） ======
# mode="testnet" かつキーありで `nagi run` が Binance Spot testnet に実発注する。
# 約定は REST myTrades ポーリング(≤5s)で取り込む（listenKey WS は廃止 #72。即時 WS
# 約定は Ed25519 session.logon が必要 → 残課題 #75）。エンジンの reconcile はこの
# ≤5s ラグに合わせてスロットルされ、未確定約定の二重発注を防ぐ（#62/#66）。
# 配管確認 CLI: testnet-check(REST) / testnet-trade(adapter) / testnet-reset(口座フラット化)。
# シークレットは env 参照のみ。default='' でキー無しでも backtest/paper run は可。
{% if vars.profile == "bitbank" %}
mode = "paper"        # bitbank はまだ paper のみ（実板に対する擬似約定。執行配線は #101 Phase 3b）
venue = "bitbank-spot"
{% else %}
mode = "testnet"      # "paper"（既定）| "testnet"。testnet+キーで `nagi run` が実約定
venue = "binance-spot"
{% endif %}
pool_pct = 0.70        # co-located: 管理プール = pool_pct × 口座残高、残りは per-slice バッファ（<1 必須）
# co-located（案2）: 全 sleeve が下の単一 [[account]] "main" を共有。単一キー欄は空にし、口座は [[account]] から。
api_key = ""
api_secret = ""

[[account]]
id = "main"
{% if vars.profile == "bitbank" %}
api_key = "{{ vars.bitbank_key }}"
api_secret = "{{ vars.bitbank_secret }}"
{% else %}
api_key = "{{ vars.binance_key }}"
api_secret = "{{ vars.binance_secret }}"
{% endif %}

# === 運用アラート（任意・既定オフ） ==================================
# 主要な状態遷移（いまは risk halt）を Discord webhook に push。無人運用で
# 「気づいたら halt していた」を防ぐ。URL は env 参照のみ（リテラル禁止）。
[notify]
enabled = true
discord_webhook_url = "{{ env(name='NAGI_DISCORD_WEBHOOK', default='') }}"
fills = true   # 約定（fill）ごとに通知。1ティック分はまとめ、バーストはシンクで coalesce。
on_flat = true

# === 市場レジーム・フィルタ ==========================================
# fast/slow EMA の乖離でトレンド/レンジ判定。sleeve を誤ったレジームで退避。
[regime]
enabled = true
fast = 20
slow = 50
trend_threshold_pct = 1.5 # |emaFast-emaSlow|/emaSlow*100 がこれ以上でトレンド ← autotune が上書き
threshold_vol_mult = 0.0
trend_exit_pct = 0.25 # #167 ヒステリシス: 一度 trend 入りしたら乖離が 0.25% を割るまで range に落とさない。境界(0.5%)張り付き時に1円の下げで trend sleeve がフラット化する whipsaw を防ぐ。0=off。autotune は触らないユーザーノブ
# --- 暴落退避（#28 / #40。低リスク方針なので有効化） ---
downtrend_flatten = true    # #28 自分自身が confirmed downtrend の間、grid/DCA を現金退避（ナンピン停止）
downtrend_reclaim_pct = 3.0 # 安値からの戻り% で再エントリー（時間ベースでなく回復確認で再武装）
{% if vars.profile == "bitbank" %}
btc_filter = false          # bitbank は単一フィードで BTC 参照を別途張れないため当面 off（要 #101 でクロス銘柄フィード）
{% else %}
btc_filter = true           # #40 BTC が崩れてる間 alt を退避。※ symbol=BTCUSDT 中は自己参照で inert、alt にすると発動
{% endif %}
btc_symbol = "BTCUSDT"      # 参照シンボル。live は起動時に bind（変更は restart 必要）

# === 高速プライスストップ（実装・検証済み → off のまま） ==============
# 毎ティックの価格ベース退避。grid/DCA を急落で即フラット化し、equity DD 15%
# の risk halt より手前・時間足ラグ無しで反応する穴を埋める狙い。
# 検証結果（BTCUSDT 15m/1h backtest + 90d autosim）: realistic 閾値では現データを
# 改善せず ＝ 不発（捕まえる急落が無い）か、緩下げで whipsaw（押し目を底で売る）。
# autotune が下落時に DCA→trend へ配分回転して既に代替しているのも一因。
# → 既定 off。flash crash(2020-03 級)を特に防ぎたい時だけ on にし、必ず再計測。
[faststop]
enabled = false
mode = "trailing" # "trailing"=直近高値からの下落 / "velocity"=window_min 内の下落（急落検知・緩下げ無視）
#   ※ velocity は「足 < window_min」でないと構造的に不発
drop_pct = 8.0    # 参照高値からこの% 下落で退避
window_min = 30   # velocity の参照窓（分）。trailing では無視
reclaim_pct = 3.0 # 安値からこの% 戻りで再武装（時間ベースでなく回復確認）

# === 最適化（autotune）の挙動ノブ ===================================
# 探索された候補を「どう選抜するか」。値そのものでなく選抜の頑健性を決める。
[optimize]
robust_folds = 1 # #29 訓練窓を 3 分割し最悪 fold スコアで選抜（過学習除去）。1=従来。大きいほど厳しく遅い
train_symbols = [
  "ETHUSDT",
  "SOLUSDT",
] # #30 複数銘柄で頑健性検証。OOS 報告は trade symbol のまま。空=単一銘柄
symbol_agg = "worst" # #39 銘柄間集約: "worst"=全銘柄で持つ（資本保全）/ "mean"=平均（リターン寄り）
plateau_k = 5 # #29 単一ピークでなく近傍 k 個の平均スコアが高い「台地」を選抜（孤立スパイク=過学習を回避）。1=従来 argmax
# breadth_penalty = 0.0     # #29 探索幅ペナルティ: 候補が多いほど勝者の OOS スコアを scale×σ×E[max of N] で割引（switch のバーを上げる）。0=無効（既定）。train/test 分割が主防御なので副次 prior、有効化時は小さめ(0.1〜0.3)から
# wf_windows = 0            # #29 walk-forward 選抜: 各候補を w 個のローリング 50%重複前方窓で評価し最悪窓で選抜（時系列汎化を要求）。>=2 で robust_folds の分割を置換、0/1=無効（既定→robust_folds のまま）
# sweep_slope = false       # #31 trend の trend-strength スロープゲート(slope_min_pct)を最適化器で探索。OOS 改善時のみ採用。false=ゲート常時off（既定→byte-for-byte）

# === ポートフォリオ DD 連動の縮小ラダー（有効化） ====================
# 全体が drawdown したら新規注文サイズを段階的に縮小（暴落での出血を抑える）。
[derisk]
enabled = true
start_dd_pct = 5 # この DD% から縮小開始
full_dd_pct = 20 # この DD% で min_scale に固定
min_scale = 0.34 # 最大縮小時の注文サイズ倍率（≈ 1/3）

# === ボラ・ターゲティング（有効化） ==================================
# 実現ボラが上がると露出を下げる（チョップ/暴落帯から自動で身を引く）。derisk と乗算合成。
[voltarget]
enabled = true
target_vol_pct = 1.0 # 目標の 1 バールあたり実現ボラ%。露出 ≈ target/realized
period = 20          # 実現ボラ推定のバー数
min_scale = 0.5      # 高ボラ時の下限倍率
max_scale = 1.0      # 1.0=縮小のみ（レバレッジ無し）。>1 は低ボラ時に増し玉（現金マイナス注意）

# === ファンディング・ティルト（#31 perp 専用。既定 off） ==============
# 8h funding の絶対値が極端＝ポジション混雑＝平均回帰リスク高。混雑側へ増し玉せず
# 新規エクスポージャを縮小する（derisk/voltarget と乗算合成）。spot は funding=0 で不発、
# 既定 off なので byte-for-byte。perp で検証して OOS 改善時のみ有効化。
# ※適用範囲: backtest / optimize / autosim のみ。live(`nagi run`)は funding feed 未配線
#   （現状 spot testnet）なので live では不発。perp live 配線は今後の課題。
[funding_tilt]
enabled = false  # true で有効化（perp のみ作動）
start_pct = 0.05 # |8h funding率%| がこれ以上で縮小開始（Binance 中立は ~0.01%）
full_pct = 0.2   # この |率%| で min_scale に固定
min_scale = 0.5  # 最大縮小時の注文サイズ倍率

# === リスク制限（各 sleeve の自己 equity に適用） ====================
[risk]
max_drawdown_pct = 15    # この DD% で取引停止
daily_loss_limit = 0     # 1 日損失上限（0=無効）
halt_outside_band = true # グリッド帯を外れたら停止
halt_liquidate = true    # 停止時にポジションを成行クローズ（低リスク推奨。トレードオフ: 急落停止で底値売り）

# === アカウント級キルスイッチ（任意・既定オフ） ======================
# per-sleeve risk は各 sleeve 自身の equity しか見ない。複数 sleeve が各自の
# 上限内でも口座全体が出血するケースの最終バックストップ（集約で判定）。
# トリップ＝全 sleeve を停止（flatten 任意）。sticky で、解除は reload のみ
# （autotune が現状況に再最適化してから再武装。time-based 自動再開はしない）。
# [killswitch]
# enabled = true
# max_loss_pct = 25            # 開始時 equity から -25% で発火（0=無効）
# max_gross_exposure_pct = 0   # Σ|建玉notional| が開始 equity の n% 超で発火（0=無効。主に perp）
# flatten = true               # 発火時に全 sleeve 成行クローズ（false=新規停止のみ）

# ⚠ 応急: persist_config の書き戻し(rewrite_templated_config)は [[sleeve]] 以降を捨てる。
#    そのため [mm] は [[sleeve]] より前に置いて autotune persist で消えないようにする。
#    本修正は tail 保全PR で対応予定（それ後はこの順序制約は不要になる）。
[mm]
pair          = "xrp_jpy"
paper         = false             # LIVE 実弾運用用（~/.config/nagi/ 配下＝repo 外。Claude/git の checkout 操作で飛ばないようにここに置く）
lot           = 4.0               # 片側あたりの発注数量
max_inventory = 240               # 在庫上限（±これを超える側は引く）= lot 60本ぶん。
#                                 # 2026-08-10 に 60 → 120。理由: 60 では上限張り付きが
#                                 # 5日に1回・全時間の14.5%発生し、その間は両側とも出せず
#                                 # リベートがゼロになる（実際 08-10 19:41 に到達し29分停止）。
#                                 # 120 なら張り付きは19日に1回・3%程度に落ちる（38日リプレイ）。
#                                 # リスク: 建玉 19,620円、証拠金5万に対し委託保証金率255%
#                                 # ＝追証(50%)まで -205%、ロスカット(25%)まで -230% で到達不能。
#                                 # 実測の最悪含み損は 08-10 の -23円、8/8-09 通期でも -9.9円。
#                                 # 上げても収入は+12%程度しか増えない。買っているのは
#                                 # 「張り付いて何もできない時間」の削減であって収入ではない。
#                                 # 深さ側のブレーキ(max_open_loss_quote)は #292 で作業中。
#                                 # マージ前に書いてはいけない（建玉があると即 taker で投げる）。
exit_full_size = true              # #260: 減らす側は保有数まるごとで出す。|在庫| <= lot では
#                                  # 完全な no-op なので、ナンピンが起きる時間帯だけ効く。
#                                  # A/B の因子ではなく常時ON: 「手加減したナンピン」を
#                                  # 測らないため(ユーザー判断 2026-07-28)。
reduce_only_keeps_entries = true # #260: A/B 因子2。nagi-mm-gate が毎時ハッシュで切替。
#                                  # 手で変えても5分で戻る。実験停止は schedule を disable。
venue_legs = false                # 2026-08-08 一時的に OFF(根本修正まで)。true にすると
#                                  # 決済サイズが「脚まるごと」= 20秒前の positions poll 由来に
#                                  # なる(false なら inventory=3秒鮮度)。在庫が減った後も古い
#                                  # サイズを出すため bitbank 50062 で拒否され、実測4時間で
#                                  # 270件。うち98%は両建てと無関係(sell 3.0 vs 在庫 1.5)。
#                                  # 拒否中はその側の quote が消えるので出口も塞がる。
#                                  # 8/8 の両建て(long/short 各1.0028)は true の間に解消済み。
#                                  # 再発リスクは戻るが、恒常的な拒否より軽いと判断。
#                                  # 修正案は3回とも別の穴を開けた → Issue で設計し直し。
#                                  # ※ 以下は #275 の本来の意図:
#                                  # position_side を「自分のネット在庫」ではなく
#                                  # venue の実建玉から選ぶ。off だとネットflat時に
#                                  # bid=新規ロング / ask=新規ショートを出すため、両方
#                                  # 約定すると両建てが積み上がる(2026-08-07 実測:
#                                  # long 1.1028 vs short 1.0028、内部 inv は 0.1)。
#                                  # on では「閉じられる脚がある側は必ず閉じる」ので
#                                  # 新規の両建てを作らず、既存分も約定のたびに減る。
#                                  # スナップショットの肯定的情報だけ信頼(空脚はネットに
#                                  # フォールバック)。60秒古い建玉情報は使わない。
#                                  # hot-reload 可 = 再起動なしのキルスイッチ。
flat_entry_ungated = true         # #310 実験(2026-08-15 武装)。フラット時の「初手」だけゲートA〜Hを免除。
#                                 # 2手目以降のナンピンは通常どおり全ゲート。max_inventory は免除対象外。
#                                 # 根拠: 収入は出来高に線形。直近7日 net/notional = 2.03bp ± 0.11
#                                 # = maker リベートそのもの(realized は +1.36円 = ゼロ)。回転数が効く。
#                                 # ⚠実質「フラット時ゲートOFF」に近い: 14日でエントリーの52%が初手、
#                                 # エピソードの72%はナンピンしない。
#                                 # 判定は fills/h で、ベースラインは 約4.8/h(直近7日、全時間)。
#                                 # 2日見て2倍に届かなければ前提が外れ → false に戻す。
#                                 # net や net/bp では判定不能: exit floor が毒を realized でなく
#                                 # 在庫時間に繰り延べるので、bp は 2.03 のまま動かない。
#                                 # hot-reload 可 = キルスイッチ。false に書けば ~5s で戻る(再起動不要)。
hold_secs       = 15              # この秒数保有したら reduce-only(減る側だけ passive)へ。両レグ maker=リベート両取り
taker_after_secs = 0             # 在庫がこの秒数残ったら taker で強制フラット(リスク非常口)。0=永久にtakerしない(maker-only, 既定)
#                                 # 2026-07-23 に 120 で運用したが中止: 時間だけを見て方向を見ないため、
#                                 # 利益側の建玉(+0.018)や 0.7bp しか逆行してない建玉に 12bp の taker fee を
#                                 # 払ってしまった(fee が損失の17倍)。時間デッドラインは fee デルタ 14bp の
#                                 # break-even を満たさない。方向チェック付きの taker_early_bps(#247)が本筋。
#                                 # ライブでも有効: armed 時はアグレッシブ側タッチに post_only=false の
#                                 # 指値を打って全在庫を切る(resting している reduce quote は先にキャンセル)。
#                                 # fill は通常の venue fill ポーリングで帰ってくるので二重計上なし。
taker_early_bps = 0              # v2 fee-aware 早期カット(#247): reduce-only 中、arm 時点からの逆行幅が
#                                 # この bp を超え、かつ直近10秒の最悪値を更新中(=まだ走ってる)なら、deadline を
#                                 # 待たず taker で切る。14 = taker fee 12bp + リベート放棄 2bp の break-even。
#                                 # 戻り途中(最悪値更新していない)の建玉は跨がない = 平均回帰の回復を殺さない。
#                                 # 0=無効(既定)。hot-reload 対応。v1(taker_after_secs)は方向を見ず誤爆した
#                                 # 実績があるため 0 のまま、こちらを本線とする。
#                                 # 2026-07-24: 14 で運用したところ break-even ちょうどでの発火がチョップで
#                                 # fee 負けした(5発中3発が微差)。fee 固定12bp を回収するにはもう一段深い
#                                 # run だけを切るべき、として 20 に引き上げ。
exit_patience_secs = 360000       # エグジット床: reduce-only 開始からこの秒数の間、エグジット quote を
#                                 # avg_cost に床張りする(long なら max(best_ask, cost)、short なら
#                                 # min(best_bid, cost))。タッチ追従のままだと bounce 直前で拾われる
#                                 # (エグジットは最も逆選択される fill、実測−5〜−7bp @30-60s)。
#                                 # スクラッチ往復でも信用は両レグのリベート(+約4bp)が残る。
#                                 # 195件のライブエグジットの反実仮想: 60s窓で gross エグジット損益
#                                 # −19.1 → −13.5 JPY 改善。窓を過ぎたら従来どおりタッチ追従。
#                                 # 床がタッチをまたぐ形にはならない(max/min がタッチに合わせる)ので
#                                 # post-only 拒否ループは起きない。トレードオフ: 床張り中に価格が
#                                 # 走ると塩漬けになる → それを縛るのがこの窓と taker_after_secs。
#                                 # 0=無効(既定)
lot_shadow = true                 # #243 シャドウモード: 「vol比例lotならいくつだったか」をstatusログに出すだけ。
#                                 # 実発注は現行 lot のまま（口座リスクゼロ）。1週間ログを貯めて検証セットにする。
# lot_target_risk = 0.01           # lot ≈ target_risk / (mid · vol_bps/1e4)。凪で大、荒れで小。
# lot_shadow_min  = 0.25           # hard 下限
lot_shadow_max  = 16.0            # hard 上限(#233)。可視レベルサイズより十分下に保つこと。
#                                 # 2026-08-01 引き上げ(4.0→16.0)。既定4.0では 3,378/5,855 tick が上限張り付きで、
#                                 # shadow_lot 加重 markout の差が -0.034bp CI[-0.206,+0.160]＝精密なゼロ
#                                 # ＝検証セットが構造的に判別不能だった(178 fills, #233 にコメント)。
#                                 # 16.0 で vol>0 域の張り付きは 21.8%→6.5% に落ち、ルールが変数として動く。
#                                 # ⚠これは shadow のみ＝実発注は不変。実lot は別の固定キャップが守る。
#                                 # ⚠張り付き 3,378 のうち 2,687 は vol_bps==0(lot が発散)で、上限では直らない。
#                                 # gate-E の 1s log-mid std が tick幅(≈0.06bp)に対し飽和している別問題。
lot_shadow_score = true           # #259 スコアシャドウ: prints10s×フロー方向セルの would-be 倍率をstatusログに出すだけ。
#                                 # 実発注は現行 lot のまま（口座リスクゼロ）。shadow_lot(vol版)と併記され、1週間で両モデルの検証セットにする。
# lot_shadow_score_counter     = 2.0  # counter-flow(逆フロー streak>=2)セルの倍率
# lot_shadow_score_counter_hot = 3.0  # counter-flow + prints>=10 の倍率。tox_window_secs=10 前提
# lot_shadow_score_none_hot    = 2.0  # フローなし + prints>=10 の倍率。with-flow は常に 1x
jst_hours     = []  # ゲートA: 深夜帯(JST 23,0-5)は引用しない。
#                                 # 2026-07-30 実fill検証(1,620 fills): JST 0-5/23 は 15s/60s/900s 全ホライズンで
#                                 # リベート込みでもマイナス(28d per-print markout でも 0,2,3,4,23時 が <-2.2bp)。
imb_gate      = 0.1               # ゲートB: 逆風インバランス時は該当サイドを引く
trend_slow_secs = 300             # ゲートC: 遅EMA秒(0=ゲート無効)。トレンドに逆らって在庫を増やさない
trend_fast_secs = 30              # ゲートC: 速EMA秒(< trend_slow_secs)
trend_band      = 0.0005          # ゲートC: |速-遅|/遅 がこれ超でトレンド判定(0.0005=0.05%)。以内はレンジ=両サイド
tox_max_prints  = 10              # ゲートD: 直近 tox_window_secs 秒の約定がこれ以上でバースト判定。売り優位(≥2:1)ならbidのみ、買い優位ならaskのみ、混在なら両側を引く(逆フロー側の優良fillを殺さない)。0=無効
tox_max_streak  = 3               # ゲートD: 同側連続プリントがこれ以上で、その側が埋まる quote を引く(sell連続→bid引く)。0=無効
tox_window_secs = 10              # ゲートD: 上記2つの計測窓(秒)
vol_max_bps     = 0.5             # ゲートE: 1s mid リターンの実現ボラ(bp)がこれ超で両側を引く(vol≈markout)。0=無効
#                                 # 0.5に引き締め(#240): mm-regime の実fill volバケット分析で 0.5-1.0bp は
#                                 # 往復NET約-1.6bpの毒(<0.5は+0.7bp marginal)。fillの23%を捨て静かなregimeに絞る。
#                                 # 効果は1週間後に mm-regime で before/after 検証すること（実験として計測）。
vol_window_secs = 60              # ゲートE: ボラ計測窓(秒)。ウォームアップ中はブロックしない
cooldown_secs = 0                 # ゲートF: 自己約定後、その側の新規(ポジションを増やす)quoteをこの秒数止める。
#                                 # buy約定→bid側、sell約定→ask側。ライブ初回で有毒fillの8秒後に再エントリして
#                                 # 連敗したのが動機。減らす側(エグジット)は全ゲート同様に免除。0=無効(既定)
#                                 # ライブ注意: 起点はvenueの約定時刻だが、fillの検知はRESTポーリング(約3s+遅延)で
#                                 # 遅れるため、実効の抑制時間はそのぶん短くなる。fillポーリング間隔より十分大きく
#                                 # 設定すること(≤約4sだとライブでは実質発火し得ない)。
#                                 # 1注文の部分約定ごとに時刻は再スタンプされる(じわじわ貫かれると
#                                 # cooldown_secs を超えて延長される。最新printが最も新鮮な毒性の証拠なので意図的)。
#                                 # なおエントリー側スタンプでは hold_secs 超の値は reduce-only に覆われて
#                                 # ほぼ効かないが、エグジット側スタンプによるフラット後の再エントリ抑制には
#                                 # 効くので、>15s も無意味ではない。
min_front_qty = 0                 # ゲートG: 最良bid/askの板厚がこれ未満ならその側を引く。薄い板の先頭に
#                                 # 並ぶと有毒バーストの最初のprintで拾われる。厚い壁が先にバーストを吸収する。0=無効(既定)
#                                 # ゲートFと違い grow-only ではない: 通常モードでは「減らす側」のquoteも
#                                 # 薄い板なら引く(エグジットこそ最も逆選択されるfill、実測−7.2bp @60s。
#                                 # 薄いaskへの売りはまさに有毒なエグジット)。免除されるのは hold_secs 経過後の
#                                 # reduce-only 分岐だけ(他ゲートと同じ)。
#                                 # ヒステリシス: 一度引いた側は板厚が 1.5×min_front_qty 以上に回復するまで
#                                 # 再参加しない(閾値またぎの Cancel→Place 往復でキュー位置を失うのを防ぐ)。固定1.5倍。
#                                 # 評価する板厚からはタッチに置いた自前の resting lot を差し引く
#                                 # (公開板には自分の注文が含まれるため)。
drift_gate_bps = 5                # ゲートH: 30分 mid ドリフトが <-TH なら bid を、>+TH なら ask を引く
#                                 # (方向性ドリフトゲート。grow-only・片側のみ・エグジット免除・cold start は引かない)。
#                                 # 有効化 2026-07-28。根拠: (1) 22.5d markout 由来(逆ドリフト entry は 60s で負転、
#                                 # TH=5 で edge15 +1.33→+1.37, fills −4.5%)、(2) mm-tune shadow 4/4 サイクルで
#                                 # winner が drift_gate_bps=5 を選択、(3) ライブ fill 9日分のエピソード分析で
#                                 # 損失の本体が下落中ロングの含み損切り(−25.6/−18.4 JPY)と判明、
#                                 # drift proxy で −18.4→−11.8 に改善。OOS-suspect 扱い: 後続窓で再測定して
#                                 # 効いていなければ 0 に戻す。
levels        = 20                # imbalance 算出に使う板の段数
status_port   = 8788              # ステータスページ http://127.0.0.1:8788/ (0=無効)
# db_path = ""                    # ダッシュボード履歴(fills + equity)の SQLite。
#                                 # 空=既定で mm-{pair}-{paper|live}.db を自動導出。
#                                 # paper/live もペアも別ファイルになるので、将来アルトごとに
#                                 # プロセスを分けてもそのまま(SQLite は 1ファイル1ライタ)。
#                                 # ★復元されるのは「表示履歴だけ」。在庫と realized PnL は
#                                 #   従来どおり fill ストリーム + venue の一度きり seed が権威。
#                                 #   equity 曲線は display_offset で再起動をまたいで連続に見せる。
control_token = "{{ env(name='NAGI_MM_TOKEN', default='') }}"
#                                 # ↑ default='' は必須。teravars は TOML パース前に
#                                 #   ファイル全体を描画するので、# コメント内のテンプレートも
#                                 #   評価される。default 無しだと未設定の env で設定読込ごと落ちる。
#                                 # 未設定なら空文字=制御ルート未登録(読み取り専用)に倒れるので、
#                                 # ボタンを実際に使うには NAGI_MM_TOKEN の export が必要。
#                                 # ダッシュボードの HALT / リセットボタンを有効化する共有シークレット。
#                                 # 空(既定)なら POST ルート自体を登録しない=読み取り専用のまま。
#                                 # [server] host は Tailscale/LAN 用に 0.0.0.0 にすることがあるため、
#                                 # 「取引停止」「履歴消去」を無防備に晒さないよう必須にしてある。
#                                 # ブラウザからは X-Nagi-Token ヘッダで送るので素の form POST (CSRF) は通らない。

# === 市場データ録画（nagi record / 別プロセス nagi-record.exe）=========
# [mm] と同じく [[sleeve]] より前に置く（persist tail 保全は #198 で修正済みだが head 側が確実）。
# 横断 OOS 目的で複数ペアを録る。gate 研究(markout/imbalance/JST)は trades+book_snap で足りるが、
# depth_events を残すと queue-ahead リプレイ(prints≠fills の決定打)が全ペアで可能。
# 容量: depth 込みで ~112MB/日/ペア（81% が depth_events）。5ペア ≈ 600MB/日 ≈ 18GB/月。
# 空き容量に注意し、古い depth_events は定期 prune 前提（trades/book_snap は安いので保持）。
[record]
pairs = ["xrp_jpy", "btc_jpy", "eth_jpy", "sol_jpy", "doge_jpy"] # xrp=既存+横断OOS用にメジャー/準メジャー/速アルト/リテール毒を追加
raw_events = true   # depth_events も保存（queue-ahead リプレイ用）。false なら trades+book_snap のみ ~8MB/日/ペア
# db_path = "market.db"  # 既定（ボットの nagi.db とは別ファイル）
# levels = 25            # book_snap の板段数（既定）
# snap_secs = 1          # book_snap 間隔（既定）

[[sleeve]]
strategy = "grid"
alloc = 0.0
label = "grid"
regime = "range"
account = "main"

[sleeve.grid]
band_pct = 12.0
grids = 20
order_quote = 150.0
recenter = true
recenter_trigger = 0.7
vol_adapt = false
vol_bars = 20
vol_k = 2.0

[[sleeve]]
strategy = "dca"
alloc = 0.9
label = "dca"
regime = "any"
account = "main"

[sleeve.dca]
order_quote = 150.0
drop_pct = 1.0
take_profit_pct = 2.0
max_buys = 40
rsi_period = 14
rsi_buy = 25.0

[[sleeve]]
strategy = "trend"
alloc = 0.1
label = "trend"
regime = "trend"
account = "main"

[sleeve.trend]
fast = 8
slow = 34
atr_period = 10
atr_mult = 2.0
order_quote = 400.0
target_vol_pct = 2.0
short_enabled = false
trend_filter = 0
slope_min_pct = 0.0


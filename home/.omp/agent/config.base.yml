symbolPreset: nerd
theme:
  dark: dark-tokyo-night
setupVersion: 3
autolearn:
  enabled: true
modelRoles:
  smol: openai-codex/gpt-6.2-sol
  slow: anthropic/claude-opus-5-5
  plan: openai-codex/gpt-6.2-astra
  default: anthropic/claude-fable-5-2
  designer: anthropic/claude-opus-5-5
  tiny: deepseek/deepseek-v4-flash
  advisor: openai-codex/gpt-6.2-astra
